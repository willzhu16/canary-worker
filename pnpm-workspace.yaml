allowBuilds:
  esbuild: true
  workerd: true
  sharp: true

# undici below 7.30.1 carries three advisories (GHSA-4qv8-2p9j-2685, GHSA-f72v-6w45-q472,
# GHSA-xjj6-f33q-929c) and reaches us through wrangler -> miniflare, which pins it exactly, so
# no lockfile refresh can lift it: wrangler 4.152.0 (2026-10-22) still pins 7.29.1. Nothing
# here sends untrusted requests through miniflare, but `security / osv` gates the build.
# Drop this once a wrangler release pins undici at 7.30.1 or later.
overrides:
  undici: ^7.30.1
  # qs below 6.16.1 carries four advisories (GHSA-4mjr-xmp4-gh2g, GHSA-6pq8-jhm2-2vcw,
  # GHSA-q8mj-m7cp-5q26, GHSA-x5fp-wj9c-mxmx) and reaches us through @stryker-mutator/core ->
  # typed-rest-client 2.3.1, which pins 6.15.1 exactly. athena overrides it for the same reason.
  # Pinned, not a range: a range took 6.17.1, published a day earlier, inside the three-day
  # wait for new releases. Drop this once a Stryker release stops pulling the pin in.
  qs: 6.17.1
  # minimatch below 11.0.1 carries GHSA-g3hv-75wg-m249 (glob DoS) and reaches us through
  # @stryker-mutator/core 10.1.1, which asks for ~10.2.4; no 10.x release has the fix. Stryker
  # calls only Minimatch#match, #negate, #hasMagic and minimatch(), none of which 11.0 removed.
  # Drop this once a Stryker release accepts minimatch 11.
  minimatch: 11.0.3
